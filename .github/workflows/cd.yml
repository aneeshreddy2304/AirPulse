name: CD — Deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "ml/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docker-compose.yml"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to EC2 via SSM
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: i-0c3d8e7ebf9d3e865
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ubuntu git -C /home/ubuntu/AirPulse fetch origin main",
              "sudo -u ubuntu git -C /home/ubuntu/AirPulse reset --hard origin/main",
              "sudo -u ubuntu git -C /home/ubuntu/AirPulse clean -fd",
              "sudo -u ubuntu docker compose -f /home/ubuntu/AirPulse/docker-compose.yml --project-directory /home/ubuntu/AirPulse build",
              "systemctl restart aqi-api",
              "sleep 20",
              "curl -sf http://127.0.0.1:8000/health"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command: $COMMAND_ID"

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text)

            echo "SSM status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [[ "$STATUS" =~ ^(Failed|Cancelled|TimedOut)$ ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query '[Status,StandardOutputContent,StandardErrorContent]' \
                --output text
              exit 1
            fi

            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment timed out after 10 minutes"
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '[Status,StandardOutputContent,StandardErrorContent]' \
            --output text
